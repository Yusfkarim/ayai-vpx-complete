app = "syuhjsbot-yf"
primary_region = "fra"

[build]
  dockerfile = "Dockerfile"

[env]
  API_PORT = "8080"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1

[mounts]
  source = "syuh_data"
  destination = "/data"

[vm]
  memory = "1gb"
  size = "shared-cpu-1x"
