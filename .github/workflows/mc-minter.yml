name: mc-minter
on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch: {}
permissions:
  contents: write
concurrency:
  group: mc-minter
  cancel-in-progress: false
jobs:
  mint:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: data
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install playwright
        run: pip install playwright && python -m playwright install --with-deps chromium-headless-shell
      - name: Mint x-is-human
        run: |
          python - <<'PY'
          import asyncio, json
          from playwright.async_api import async_playwright

          async def mint():
              async with async_playwright() as p:
                  b = await p.chromium.launch(headless=True, args=["--no-sandbox"])
                  ctx = await b.new_context(viewport={"width":1280,"height":800})
                  pg = await ctx.new_page()
                  got = {}
                  async def rh(route):
                      try:
                          h = await route.request.all_headers()
                          if "x-is-human" in h and "v" not in got:
                              got["v"] = h["x-is-human"]
                          await route.continue_()
                      except Exception:
                          pass
                  await pg.route("**/api/chat", rh)
                  await pg.goto("https://www.multichats.ai/chat", wait_until="domcontentloaded", timeout=45000)
                  await asyncio.sleep(4)
                  await pg.evaluate("fetch('/api/chat',{method:'POST',headers:{'content-type':'application/json'},body:'{}'}).catch(function(){})")
                  for _ in range(25):
                      if got.get("v"): break
                      await asyncio.sleep(1)
                  await b.close()
                  return got.get("v")

          tok = asyncio.run(mint())
          if not tok:
              raise SystemExit("mint failed")
          json.dump({"tok": tok, "ts": __import__("time").time()}, open("mc_hih.json", "w"))
          print("minted", len(tok))
          PY
      - name: Commit hih
        run: |
          git config user.name "minter-bot"
          git config user.email "actions@users.noreply.github.com"
          git add mc_hih.json
          git commit -m "hih refresh $(date -u +%FT%TZ)" || echo "no change"
          git push origin data
