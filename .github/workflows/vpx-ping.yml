name: vpx-ping
# BACKUP scheduler: hits /api/cron on all doors in order. First alive door runs
# full maintenance (shared KV brain); the rest skip via the 90s overlap lock.
# Passes if >=1 door answers 200, so a 503 (exhausted door) never fails the run.
# Appwrite */2min is primary. Needs: Variable VPX_APP_URL + Secret VPX_CRON.
on:
  schedule:
    - cron: "7 * * * *"
  workflow_dispatch:
jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Cron first-alive door (all 5)
        run: |
          ok=0
          for host in "${{ vars.VPX_APP_URL }}" "ayai-vpx-yusfkarim2001-1023s-projects.vercel.app" "ayai-vpx-yusfkarim81-7952s-projects.vercel.app" "ayai-vpx-yusfkarim994-4936s-projects.vercel.app" "ayai-vpx-yusfkarims-projects.vercel.app"; do
            code=$(curl -s -o /tmp/out.txt -w "%{http_code}" --max-time 100 "https://$host/api/cron?secret=${{ secrets.VPX_CRON }}")
            echo "$host http=$code"; head -c 200 /tmp/out.txt; echo
            if [ "$code" = "200" ]; then ok=1; fi
          done
          test "$ok" = "1"
