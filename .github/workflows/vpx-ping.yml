name: vpx-ping
# BACKUP scheduler: pings Vercel /api/cron hourly (Appwrite */2min is primary).
# Private repo = 2000 GHA min/month: hourly x ~2min ≈ 1440/mo. DO NOT make frequent.
# Needs: repo Variable VPX_APP_URL + Secret VPX_CRON.
on:
  schedule:
    - cron: "7 * * * *"
  workflow_dispatch:
jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Ping cron
        run: |
          code=$(curl -s -o /tmp/out.txt -w "%{http_code}" --max-time 300 "https://${{ vars.VPX_APP_URL }}/api/cron?secret=${{ secrets.VPX_CRON }}")
          echo "http=$code"; head -c 400 /tmp/out.txt; echo
          test "$code" = "200"
