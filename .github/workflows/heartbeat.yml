name: heartbeat
# Weekly timestamp commit = repo stays "active" so GitHub never auto-disables
# the scheduled vpx-ping workflow (auto-disable hits after 60 idle days).
on:
  schedule:
    - cron: "23 3 * * 1"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  beat:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - run: |
          date -u +"%Y-%m-%dT%H:%M:%SZ" > .github/heartbeat.txt
          git config user.name "vpx-heartbeat"
          git config user.email "vpx-heartbeat@users.noreply.github.com"
          git add .github/heartbeat.txt
          git commit -m "heartbeat: keep scheduled workflows alive" && git push || echo "nothing to push"
