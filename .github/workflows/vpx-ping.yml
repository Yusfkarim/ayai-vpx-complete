name: vpx-ping
# BACKUP scheduler: pings Vercel /api/cron hourly (Appwrite */2min is primary).
# Private repo = 2000 GHA min/month: hourly x ~2min ≈ 1440/mo. DO NOT make frequent.
# Needs: repo Variable VPX_APP_URL + Secret VPX_CRON.
on:
  schedule:
    - cron: "7 * * * *"
  workflow_dispatch:
jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Ping cron (all doors)
        run: |
          fail=0
          for host in "${{ vars.VPX_APP_URL }}" "ayai-vpx-yusfkarim2001-1023s-projects.vercel.app" "ayai-vpx-yusfkarim81-7952s-projects.vercel.app"; do
            code=$(curl -s -o /tmp/out.txt -w "%{http_code}" --max-time 100 "https://$host/api/cron?secret=${{ secrets.VPX_CRON }}")
            echo "$host http=$code"; head -c 200 /tmp/out.txt; echo
            test "$code" = "200" || fail=1
          done
          exit $fail
